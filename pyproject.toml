[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-dynamics-vla"
version = "0.1.0"
description = "Dataset-first numerical object dynamics and action-learning experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10"]

[project.optional-dependencies]
datasets = ["h5py>=3.10"]
gpu = ["torch>=2.7"]
muse = ["transformers>=5.0", "accelerate>=1.0", "safetensors>=0.4"]
modal = ["modal>=1.0"]

[project.scripts]
odvla = "odvla.cli:main"

[tool.setuptools.packages.find]
include = ["odvla*"]
